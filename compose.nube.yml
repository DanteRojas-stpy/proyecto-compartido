# Los tres servicios de CostFlow (E3, E4 y E5) en un servidor con Docker, con HTTPS, para usarlos desde n8n Cloud.
# Uso:  cp deploy/nube.env.example deploy/nube.env   (completar)  y luego
#       docker compose -f compose.nube.yml --env-file deploy/nube.env up -d --build
# Recomendado: 2 vCPU y 4 GB de RAM (el lector de E3 usa OCR y modelos de embeddings). Abrir solo los puertos 80 y 443.
services:
  etapa3:
    build:
      context: .
      dockerfile: app/etapa3/Dockerfile
    restart: unless-stopped
    environment:
      E3_INTERNAL_KEY: ${E3_INTERNAL_KEY:?define E3_INTERNAL_KEY}
      NHOST_SUBDOMAIN: ${NHOST_SUBDOMAIN:?define NHOST_SUBDOMAIN}
      NHOST_REGION: ${NHOST_REGION:-sa-east-1}
      E3_N8N_URL: ${N8N_URL:?define N8N_URL}
      E3_EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      E3_MAX_FILE_BYTES: 50000000
      E3_CHUNK_CHARS: 400
      E3_CHUNK_OVERLAP: 60
      E3_CONTEXT_CHARS: 24000
    volumes:
      - etapa3_datos:/datos
    mem_limit: 1800m
  homologacion:
    build:
      context: .
      dockerfile: app/homologacion/Dockerfile
    restart: unless-stopped
    environment:
      E3_INTERNAL_KEY: ${E3_INTERNAL_KEY:?define E3_INTERNAL_KEY}
      E4_MODELO: claude-sonnet-5-5
    mem_limit: 512m
  cuadro:
    build:
      context: .
      dockerfile: app/cuadro/Dockerfile
    restart: unless-stopped
    environment:
      E3_INTERNAL_KEY: ${E3_INTERNAL_KEY:?define E3_INTERNAL_KEY}
    mem_limit: 256m
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO_E3: ${DOMINIO_E3:?define DOMINIO_E3}
      DOMINIO_E4: ${DOMINIO_E4:?define DOMINIO_E4}
      DOMINIO_E5: ${DOMINIO_E5:?define DOMINIO_E5}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
    depends_on: [etapa3, homologacion, cuadro]
volumes:
  etapa3_datos:
  caddy_datos:
