name: Comprobar frontend

# La publicación la hace Netlify (ver netlify.toml). Este flujo solo comprueba
# que el paquete estático se arma y que el JavaScript es válido.
on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/preparar_frontend_pages.py"
      - "netlify.toml"
      - ".github/workflows/publicar-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/preparar_frontend_pages.py"
      - "netlify.toml"
      - ".github/workflows/publicar-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar solo los archivos del frontend
        run: python scripts/preparar_frontend_pages.py
      - name: Comprobar JavaScript
        run: |
          node --check _site/js/app.js
          node --check _site/js/config.local.js
